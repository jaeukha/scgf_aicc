services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aicc}
      POSTGRES_USER: ${POSTGRES_USER:-aicc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aicc_dev_only}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aicc}"]
      interval: 5s
      retries: 10
  backend:
    build: .
    env_file: [{path: .env, required: false}]
    environment:
      # 컨테이너 간 통신은 localhost가 아닌 서비스 이름(postgres)을 사용한다
      QDRANT_URL: http://qdrant:6333
      EMBED_BASE_URL: http://embedder:8000
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aicc}:${POSTGRES_PASSWORD:-aicc_dev_only}@postgres:5432/${POSTGRES_DB:-aicc}
    ports: ["${BACKEND_PORT:-8000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
  # ---- 사내 지식베이스 RAG ----
  qdrant:
    image: qdrant/qdrant:v1.19.2
    volumes: [qdrant_data:/qdrant/storage]
    ports: ["127.0.0.1:6333:6333"]   # 호스트에서는 로컬 접속만(색인 스크립트·대시보드)
  embedder:
    build: ./embedder
    environment:
      EMBED_DIM: ${EMBED_DIM:-768}
      HF_HUB_OFFLINE: ${EMBED_OFFLINE:-0}   # 모델 파일을 받은 뒤 폐쇄망에서는 1
    volumes: ["./models/hf-embed:/models"]   # EmbeddingGemma 2 파일(고정 revision)
    ports: ["127.0.0.1:8104:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 30
volumes:
  pgdata:
  qdrant_data:
